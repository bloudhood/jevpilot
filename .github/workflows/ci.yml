name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
        env:
          JEVPILOT_SKIP_BROWSER: "1"
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and cache the test image, then run the browser integration suite
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: jevpilot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --init --shm-size=1g -e JEVPILOT_TEST_DISPLAY=xvfb jevpilot:test
      # The runtime image is the shipping artifact: build it and smoke its entrypoint + doctor.
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: jevpilot:runtime
          cache-from: type=gha
      - name: Smoke the runtime image (stdio tools + doctor)
        run: |
          docker run --rm --init --shm-size=1g jevpilot:runtime doctor --json --no-browser
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawn } from 'node:child_process';
          import { createInterface } from 'node:readline';

          const child = spawn('docker', ['run', '--rm', '-i', '--shm-size=1g', 'jevpilot:runtime'], {
            stdio: ['pipe', 'pipe', 'inherit'],
          });
          const lines = createInterface({ input: child.stdout });
          const send = (message) => child.stdin.write(JSON.stringify({ jsonrpc: '2.0', ...message }) + '\n');
          let initialized = false;
          let toolsListed = false;
          let timer;
          try {
            await new Promise((resolve, reject) => {
              timer = setTimeout(() => reject(new Error('MCP runtime smoke timed out')), 15_000);
              child.once('error', reject);
              child.stdin.on('error', reject);
              child.once('exit', (code, signal) => {
                if (code === 0 && toolsListed) resolve();
                else reject(new Error(`MCP runtime exited before success: code=${code}, signal=${signal}`));
              });
              lines.on('line', (line) => {
                try {
                  const message = JSON.parse(line);
                  assert.equal(message.jsonrpc, '2.0');
                  if (message.id === 1) {
                    assert.equal(message.error, undefined);
                    assert.equal(typeof message.result.protocolVersion, 'string');
                    assert.ok(message.result.capabilities.tools);
                    initialized = true;
                    send({ method: 'notifications/initialized' });
                    send({ id: 2, method: 'tools/list', params: {} });
                  } else if (message.id === 2) {
                    assert.ok(initialized);
                    assert.equal(message.error, undefined);
                    assert.ok(message.result.tools.some((tool) => tool.name === 'browser_run'));
                    toolsListed = true;
                    child.stdin.end();
                  }
                } catch (error) {
                  reject(error);
                }
              });
              send({
                id: 1, method: 'initialize',
                params: {
                  protocolVersion: '2025-03-26', capabilities: {},
                  clientInfo: { name: 'runtime-smoke', version: '1' },
                },
              });
            });
          } finally {
            clearTimeout(timer);
            lines.close();
            if (child.exitCode === null) child.kill();
          }
          NODE
