name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
        env:
          JEVPILOT_SKIP_BROWSER: '1'
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t jevpilot:test .
      - run: docker run --rm --init --shm-size=1g -e JEVPILOT_TEST_DISPLAY=xvfb jevpilot:test
